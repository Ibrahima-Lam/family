    <script>
        let data = tab.sort((a, b) => {
            return classer(a, b, ["point", "diff", "bm"])
        })

        function classer(a, b, tab = []) {
            if (tab.length === 0) return -1
            const key = tab[0]
            if (a[key] === b[key]) {
                const tab2 = tab.shift()
                return classer(a, b, tab)
            }
            return a[key] > b[key] ? -1 : 1
        }

        const tbody = document.querySelector("tbody")
        data.forEach((element, index) => {
            const { id, nom, match, points, bm, diff, be } = element

            const temp = document.getElementById('temp').content.cloneNode(true);
            const tr = temp.querySelector('tr')

            tr.querySelector(".num").innerHTML = index + 1
            tr.querySelector(".nom").innerHTML = nom
            tr.querySelector(".match").innerHTML = match
            tr.querySelector(".points").innerHTML = points
            tr.querySelector(".diff").innerHTML = diff
            tr.querySelector(".bm").innerHTML = bm
            tr.querySelector(".be").innerHTML = be
            tbody.append(tr)
        });
