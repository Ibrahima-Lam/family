<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste</title>
    <link rel="stylesheet" href="css/style1.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script0.js" defer></script>
    <script src="js/script.js" defer></script>

</head>

<body>
    <div class="nav-bar">
        <h3>Famille Lammbe Dialade</h3>
        <div class="slider">
            <span>&#9776;</span>
        </div>
        <div class="nav-link">

            <ul>
                <li><a href="index.html"> Accueil </a></li>
                <li><a href="element.html"> Eléments</a></li>
                <li><a href="liste.html"> Liste </a></li>
                <li><a href="arbre.html"> Arbre </a></li>
                <li><a href="livre.html"> détails </a></li>
            </ul>
        </div>
    </div>
    <div class="container">
        <div class="content">
            <div class="paramettre">
                <div class="form-group">
                    <label for="asc">&#8681;</label>
                    <input type="radio" name="order" class="orders" value="asc" id="asc" checked>

                    <label for="desc">&#8679;</label>
                    <input type="radio" name="order" class="orders" value="desc" id="desc">
                    &nbsp; &nbsp; &nbsp;
                    <label for="ordered">Trie:</label>
                    <select name="" id="ordered">
                        <option value="id">Id</option>
                        <option value="nom" selected>Nom</option>
                        <option value="sexe">Genre</option>
                        <option value="idg">Génération</option>
                    </select>
                </div>
                <input type="search" name="" id="search" placeholder='Recherche...'>

            </div>

            <div id="index-container" class="index-list">
            </div>
        </div>
    </div>
    <template id="li-element">
        <li class="item-list">
            <div class="element-id">

            </div>
            <div class="element-fragment">

            </div>
            <div class="element-index-menu">
                <img src="icon/three-dots-vertical.svg">
                <div class="listes-menus">
                    <div class="list-content">
                        <strong class="nom"></strong>
                        <hr>
                        <ul>
                            <li class="list-menu-item" data-element="copy">Copier</li>
                            <li class="list-menu-item" data-element="share">Partager</li>
                            <li class="list-menu-item" data-element="element">Tous sur L'élément</li>
                            <li class="list-menu-item" data-element="infos">Informations Personnelle</li>
                            <li class="list-menu-item" data-element="lignee">Lignée</li>
                            <li class="list-menu-item" data-element="parents">Parents</li>
                            <li class="list-menu-item" data-element="siblings">Fréres et Soeurs</li>
                            <li class="list-menu-item" data-element="children">Enfants</li>
                        </ul>
                    </div>
                </div>
            </div>
        </li>
    </template>
    <div class="scroller" id="scrollTop">
        <img src="icon/caret-up-fill.svg" alt="profile">
    </div>
    <template id="temp-dialog">
        <dialog class="dialog" id="dialog">
            <div class="dialog-header"></div>
            <div class="dialog-content"></div>
            <div class="dialog-footer">
                <button class="close">Fermer</button>
            </div>
        </dialog>
    </template>
</body>

</html>
